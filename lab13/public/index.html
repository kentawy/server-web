<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мої задачі</title>
</head>
<body>
    <h1>Список задач</h1>
    <nav>
        <a href="/login.html">Увійти</a> |
        <a href="/register.html">Реєстрація</a> |
        <a href="/create.html">Додати задачу</a>
        <button id="logoutBtn" style="display:none;">Вийти</button>
    </nav>
    <hr>

    <ul id="taskList"></ul>

    <script>
        // Перевіряємо токен, щоб показати/сховати кнопку виходу
        const token = localStorage.getItem('token');
        if (token) {
            document.getElementById('logoutBtn').style.display = 'inline-block';
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const data = await response.json();

                const list = document.getElementById('taskList');

                if (!response.ok) {
                    list.innerHTML = `<li>Помилка: ${data.message}</li>`;
                    return;
                }

                if (data.data && data.data.length > 0) {
                    list.innerHTML = data.data.map(task =>
                        `<li><strong>${task.title}</strong> (${task.status}) - Пріоритет: ${task.priority}<br>
                        <em>${task.description}</em> - До: ${new Date(task.dueDate).toLocaleDateString()}
                        </li>`
                    ).join('');
                } else {
                    list.innerHTML = '<li>Задач поки немає.</li>';
                }
            } catch (err) {
                document.getElementById('taskList').innerHTML = '<li>Помилка з\'єднання з сервером.</li>';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        loadTasks();
    </script>
</body>
</html>
