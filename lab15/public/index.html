<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мої задачі</title>
</head>
<body>
    <h1>Список задач</h1>
    <nav>
        <a href="/login.html">Увійти</a> |
        <a href="/register.html">Реєстрація</a> |
        <a href="/create.html">Додати задачу</a>
        <button id="logoutBtn">Вийти</button>
    </nav>
    <hr>

    <ul id="taskList"></ul>

    <script>
        const API_URL = 'http://localhost:3000';

        async function loadTasks() {
            try {
                const response = await fetch(`${API_URL}/api/tasks`, {
                    credentials: 'include'
                });
                const data = await response.json();

                const list = document.getElementById('taskList');

                if (!response.ok) {
                    list.innerHTML = `<li>Помилка: ${data.message}</li>`;
                    return;
                }

                if (data.data && data.data.length > 0) {
                    list.innerHTML = data.data.map(task =>
                        `<li><strong>${task.title}</strong> (${task.status}) - Пріоритет: ${task.priority}<br>
                        <em>${task.description}</em> - До: ${new Date(task.dueDate).toLocaleDateString()}
                        </li>`
                    ).join('');
                } else {
                    list.innerHTML = '<li>Задач поки немає.</li>';
                }
            } catch (err) {
                document.getElementById('taskList').innerHTML = '<li>Помилка з\'єднання з сервером.</li>';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch(`${API_URL}/api/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.href = '/login.html';
            } catch (err) {
                console.error('Помилка при виході:', err);
            }
        });

        loadTasks();
    </script>
</body>
</html>
